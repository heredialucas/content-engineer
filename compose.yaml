services:
  content-studio:
    build: .
    image: content-studio:latest
    container_name: content-studio
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CONTENT_ENGINE_ROOT: /app
      CONTENT_PROJECTS_DIR: /app/data/projects
      PORT: 3000
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
    ports:
      - "127.0.0.1:3170:3000"
    volumes:
      - studio-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  studio-data:
